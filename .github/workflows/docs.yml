name: Docs

on:
  push:
    branches: [master]
    paths:
      - "docfx/**"
      - "DigitalRiseModel/**"
      - ".config/dotnet-tools.json"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore library
        run: dotnet restore DigitalRiseModel/DigitalRiseModel.MonoGame.csproj

      # DocFX does not prune stale API YAML, so start from a clean state.
      - name: Clean previous output
        run: rm -rf docfx/api docfx/_site

      - name: Generate API metadata
        run: dotnet docfx metadata docfx/docfx.json

      - name: Build documentation
        run: dotnet docfx build docfx/docfx.json

      - name: Disable Jekyll processing
        run: touch docfx/_site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docfx/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
